<style>
:root{--ink:#273e3a;--green:#226b55;--soft:#e6efe4;--cream:#faf8ee;--line:#dce4d6;--gold:#edb946}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif}button,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit}button:disabled{cursor:default;opacity:.6}button:focus-visible,a:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:4px solid #8c57c3;outline-offset:4px}header{border-bottom:1px solid var(--line);background:#fffdf7}.top{max-width:1160px;margin:auto;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;gap:12px;align-items:center;font-size:22px;font-weight:900}.logo{display:grid;place-items:center;background:var(--green);color:white;width:44px;height:44px;border-radius:15px;transform:rotate(-8deg)}a{color:var(--green)}.tools{display:flex;gap:16px;align-items:center}.small{font-size:14px}.quiet{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 15px}.wrap{max-width:1160px;margin:auto;padding:32px 28px 50px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:bold;color:var(--green)}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}h1{font-size:clamp(30px,4vw,46px);letter-spacing:-1.5px;margin:10px 0}p{line-height:1.6;margin:8px 0;color:#52665e}.garden{font-size:44px;letter-spacing:8px;color:var(--green)}nav{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:24px}.tab{background:#eeeee2;border:1px solid transparent;border-radius:16px;padding:15px 10px;text-align:left;font-size:14px;font-weight:bold;display:flex;align-items:center;gap:10px}.tab span{border-radius:50%;width:27px;height:27px;display:grid;place-items:center;background:#fff9}.tab.active{background:var(--green);color:white}.tab.active span{background:#ffffff25}.panel{background:#fffef9;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 12px 30px #294c3510}.panelhead{display:flex;justify-content:space-between;gap:15px;align-items:center}.pill{background:#edf2e7;padding:9px 15px;border-radius:30px;font-size:13px;font-weight:bold;white-space:nowrap}h2{font-size:28px;margin:12px 0 5px;letter-spacing:-.7px}.progress{height:6px;background:#e9eddf;margin:20px 0 24px;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);transition:width .3s}.stage{background:#eef1e7;border-radius:20px;min-height:235px;display:grid;place-items:center;position:relative;overflow:hidden}.stage:before,.stage:after{content:'';width:150px;height:150px;border:1px solid #dce3d1;border-radius:50%;position:absolute;pointer-events:none}.stage:before{left:-50px;bottom:-70px}.stage:after{right:-60px;top:-65px}.stage .shape{width:160px;height:160px;filter:drop-shadow(0 9px 0 #243e3012)}.shape{width:56px;height:56px;display:block;flex-shrink:0}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.answer{min-height:58px;border:2px solid var(--line);border-radius:14px;background:white;font-weight:bold}.answer:hover,.quiet:hover{border-color:var(--green);background:#eff5ed}.answer.correct{background:#dcefdc;border-color:#3c8558}.answer.wrong{background:#fff0df;border-color:#d89043}.bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;min-height:52px}.feedback{font-weight:bold;color:var(--green);line-height:1.5}.primary{background:var(--green);border:0;color:white;padding:15px 25px;border-radius:14px;font-weight:bold;min-height:50px}.primary:hover{background:#17523f}.help{text-align:center;font-size:13px;margin-top:20px}.sequence{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:24px 8px}.tile,.slot{width:84px;height:90px;border-radius:15px;background:white;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;position:relative}.tile small,.slot small{font-size:10px}.slot{border:2px dashed #94ac98;background:#f8faef;cursor:pointer;font-weight:bold;font-size:24px}.slot.selected{outline:3px solid var(--green);outline-offset:3px}.slot.filled{border-style:solid;background:white}.slot.over{background:#dcebd8}.pattern-answer{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px}.bank{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;background:#f0f2e8;border-radius:18px;padding:18px}.piece{display:grid;place-items:center;gap:3px;background:white;border:2px solid transparent;border-radius:12px;padding:8px;min-width:65px;min-height:78px;touch-action:none}.piece small{font-size:10px}.piece:hover{border-color:var(--green)}.piece.chosen{border-color:var(--green);background:#dff1dc}.piece.used{opacity:.25}.bank .shape{width:43px;height:43px}.label{font-weight:bold;font-size:14px;margin:22px 0 10px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}select{padding:10px;border:1px solid var(--line);border-radius:10px;background:white;max-width:100%}.scene{display:block;width:100%;height:auto;max-height:430px;border-radius:20px;background:#dff0ed}.scene [role=button]{cursor:pointer;outline:none}.scene [role=button]:hover,.scene [role=button]:focus-visible{filter:drop-shadow(0 0 5px #274e42);stroke:#273e3a;stroke-width:4}.scene [data-found=true]{opacity:.45;stroke:#226b55;stroke-width:5;stroke-dasharray:7 5}.complete{text-align:center;padding:40px 10px}.complete .medal{font-size:68px}.complete h2{font-size:36px}.dragghost{position:fixed;pointer-events:none;z-index:1000;background:#fff9;border-radius:14px;padding:10px;transform:translate(-50%,-50%)}.playing{background:#fce8aa!important;transform:translateY(-6px)}footer{display:flex;justify-content:space-between;margin-top:25px;font-size:12px;color:#69796d}@media(max-width:760px){.wrap{padding:22px 16px}.top{padding:15px 16px}.brand{font-size:18px}.garden{display:none}nav{gap:6px}.tab{flex-direction:column;text-align:center;font-size:11px;padding:10px 3px;gap:7px}.panel{padding:18px}.answers{grid-template-columns:repeat(2,1fr)}.tools{gap:9px}.tools a{font-size:12px}.tile,.slot{width:64px;height:77px}.sequence{gap:8px;padding:20px 0}.shape{width:45px;height:45px}.panelhead{align-items:flex-start}.pill{font-size:11px;padding:8px}h2{font-size:24px}.bottom{align-items:flex-start}.primary{padding:14px 17px}.piece{min-width:57px;padding:6px}.bank{gap:7px;padding:12px}.intro{margin-bottom:20px}.stage{min-height:210px}footer{gap:15px}.scene{min-height:230px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Keep the pattern shapes separate and inside their own tiles. */
.shape-pattern{width:100%;min-width:0;gap:28px;padding:28px 16px}
.shape-pattern .tile{flex:0 0 92px;width:92px;height:96px}
.shape-pattern .shape{width:64px;height:64px}
.pattern-question{display:grid;place-items:center;flex:0 0 92px;width:92px;height:96px;font-size:48px;font-weight:bold}
@media(max-width:760px){.shape-pattern{gap:24px;padding:24px 12px}.shape-pattern .tile,.pattern-question{flex-basis:72px;width:72px;height:80px}.shape-pattern .shape{width:56px;height:56px}}
.side-stage{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#eef1e7;border-radius:20px;padding:22px}.side-stage .shape{width:160px;height:160px}nav{grid-template-columns:repeat(6,minmax(0,1fr))}@media(max-width:760px){nav{grid-template-columns:repeat(3,minmax(0,1fr))}}
.coloring-page{max-height:none;background:white;border-radius:18px;touch-action:manipulation}.coloring-page [data-found=true]{opacity:1;stroke:#303531;stroke-width:2.5;stroke-dasharray:none}.coloring-page [role=button]:hover,.coloring-page [role=button]:focus-visible{stroke:#226b55;stroke-width:4;filter:none}.hunt-instruction{display:flex;align-items:center;gap:18px;margin:0 0 16px;flex-wrap:wrap}.hunt-instruction>span:last-child{margin-left:auto;font-size:14px;color:#52665e}.hunt-sample{display:block;background:#eef1e7;border-radius:14px;padding:8px}.hunt-sample .shape{stroke:#303531}.hunt-sample .shape g{stroke:#303531;stroke-opacity:1;stroke-width:3}
.hunt-viewport{overflow:auto;border-radius:18px}.coloring-page.zoomed{width:1200px;max-width:none;max-height:none}

<body>
<header><div class="top"><div class="brand"><span class="logo" aria-hidden="true">◒</span> Shape Garden</div><div class="tools"><button class="quiet small" id="read" aria-label="Read the instructions aloud">♪ Read aloud</button><a href="../index.html">← Library</a></div></div></header>
<main class="wrap"><div class="intro"><div><div class="eyebrow">Little discoveries, big smiles</div><h1>A little world of shapes.</h1><p>Look, discover, and make something wonderful.</p></div><div class="garden" aria-hidden="true">● △ ■</div></div>
<nav aria-label="Choose an activity" id="tabs"></nav><section class="panel" id="activity" aria-label="Shape activity"></section><p class="help">Take your time. Every try helps you learn. 🌱</p><footer><span>SHAPE GARDEN · LEARN THROUGH PLAY</span><span>8 shapes · 6 ways to explore</span></footer></main>
<script>
'use strict';
const names=['circle','rectangle','square','triangle','trapezoid','pentagon','hexagon','octagon'];
const colors={blue:'#4385d5',red:'#dc6053',yellow:'#edc33e'};
const labels=['Shape quiz','Count the sides','Shape hunt','What comes next?','Color patterns','My pattern'];
const $=s=>document.querySelector(s);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s[0].toUpperCase()+s.slice(1);
function geometry(n){if(n==='circle')return '<circle cx="50" cy="50" r="39"/>';if(n==='rectangle')return '<rect x="6" y="23" width="88" height="54" rx="2"/>';if(n==='square')return '<rect x="13" y="13" width="74" height="74" rx="2"/>';const pts={triangle:'50,8 94,88 6,88',trapezoid:'27,18 73,18 96,83 4,83',pentagon:'50,6 94,38 77,90 23,90 6,38',hexagon:'27,10 73,10 96,50 73,90 27,90 4,50',octagon:'32,7 68,7 93,32 93,68 68,93 32,93 7,68 7,32'};return '<polygon points="'+pts[n]+'"/>';}
function shape(n,c='#dd9860',accessible=true){return `<svg class="shape" viewBox="0 0 100 100" ${accessible?`role="img" aria-label="${n}"`:'aria-hidden="true"'}><g fill="${c}" stroke="#243e3a" stroke-opacity=".13" stroke-width="2" stroke-linejoin="round">${geometry(n)}</g></svg>`;}
let mode=0,round=0,order=[],target='',solved=false,finished=false,selected=null,slots=[],bank=[],seed=[],unit=[],shapeName='triangle',timer=null,drag=null,suppressClick=false;
const done=new Set();
function tabs(){ $('#tabs').innerHTML=labels.map((x,i)=>`<button class="tab ${mode===i?'active':''}" aria-current="${mode===i?'step':'false'}" data-mode="${i}"><span>${done.has(i)?'✓':i+1}</span>${x}</button>`).join('');}
function message(t){$('#feedback').textContent=t;}
function frame(title,desc,body,progress='',actions=''){ $('#activity').innerHTML=`<div class="panelhead"><div><div class="eyebrow">Activity ${mode+1} of ${labels.length}</div><h2 id="prompt">${title}</h2><p id="instruction">${desc}</p></div><span class="pill">${progress||'Let’s explore'}</span></div>${mode<4?`<div class="progress"><i style="width:${round/8*100}%"></i></div>`:''}${body}<div class="bottom"><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div>${actions}</div></div>`;}
function nextButton(text='Next →'){return `<button class="primary" id="next">${text}</button>`;}
function start(m){if('speechSynthesis' in window)speechSynthesis.cancel();clearInterval(timer);timer=null;mode=m;round=0;finished=false;solved=false;selected=null;order=shuffle(names);tabs();if(m===0)quiz();if(m===1)sides();if(m===2)hunt();if(m===3)pattern();if(m===4)colorRound();if(m===5)studio();}
function complete(){finished=true;done.add(mode);tabs();$('#activity').innerHTML=`<div class="complete"><div class="medal" aria-hidden="true">🌟</div><div class="eyebrow">Beautiful discoveries</div><h2>${['You know your shapes!','Super side counting!','What a shape detective!','You spotted the patterns!','Color pattern complete!'][mode]}</h2><p>${mode===0?'You explored all eight shapes.':mode===1?'You counted the sides of all eight shapes.':mode===2?'You found all eight shapes in different pictures.':'You kept the pattern going. Well done!'}</p><div class="controls" style="justify-content:center"><button class="quiet" id="again">Play again</button><button class="primary" id="continue">${labels[mode+1]} →</button></div></div>`;}
function quiz(){solved=false;target=order[round];const options=shuffle([target,...shuffle(names.filter(n=>n!==target)).slice(0,3)]);frame('What shape is this?','Look at the shape. Choose its name.',`<div class="stage">${shape(target,pick(Object.values(colors)),false)}</div><div class="answers">${options.map(n=>`<button class="answer" data-answer="${n}">${cap(n)}</button>`).join('')}</div>`,`Shape ${round+1} / 8`,nextButton());$('#next').disabled=true;}
function answer(n,el){if(solved)return;if(n!==target){el.classList.add('wrong');message('Good try! Take another look.');return;}solved=true;el.classList.add('correct');message(mode===0?`Yes! This is a ${target}.`:mode===1?`Yes! A ${order[round]} has ${target} straight sides.`:'That’s it! You found what comes next.');$('#next').disabled=false;}
const sideCounts={circle:0,rectangle:4,square:4,triangle:3,trapezoid:4,pentagon:5,hexagon:6,octagon:8};
function sides(){solved=false;const n=order[round];target=String(sideCounts[n]);const options=shuffle([+target,...shuffle([0,3,4,5,6,8].filter(x=>x!==+target)).slice(0,3)]);frame(`How many sides does a ${n} have?`,'Count the straight sides. Choose a number.',`<div class="side-stage"><button class="quiet" id="hint">Need a hint?</button><div id="sidehint" aria-live="polite"></div></div><div class="answers">${options.map(x=>`<button class="answer" data-answer="${x}">${x}</button>`).join('')}</div>`,`Shape ${round+1} / 8`,nextButton());$('#next').disabled=true;}
function pattern(){solved=false;const pool=shuffle(names);const forms=[[0,1,2],[0,1,2],[0,1],[0,0,1],[0,1,1],[0,1,2,3]];const form=forms[round%forms.length];unit=form.map(i=>pool[i]);const length=[6,5,6,5,7,5,6,7][round];target=unit[length%unit.length];let seq=Array.from({length},(_,i)=>`<div class="tile">${shape(unit[i%unit.length],'#8d79b7',false)}</div>`).join('');const options=shuffle([target,...shuffle(names.filter(n=>n!==target)).slice(0,3)]);frame('What comes next?','Look for the part that repeats. Pick the next shape.',`<div class="stage"><div class="sequence shape-pattern">${seq}<span class="pattern-question" aria-label="What shape comes next?">?</span></div></div><div class="answers">${options.map(n=>`<button class="answer pattern-answer" data-answer="${n}" aria-label="${n}">${shape(n,'#8d79b7')}<span class="small">${cap(n)}</span></button>`).join('')}</div>`,`Pattern ${round+1} / 8`,nextButton());$('#next').disabled=true;}


// Coloring-page scenes: the clickable shapes are the objects themselves.
const scenes=['Sunny garden','Seaside picnic','Moon base','Coral reef','Castle courtyard','Snowy village','Busy city','Toy room','Flower farm','Desert camp','Jungle trail','Mountain lake','Train station','Birthday party','Dinosaur valley','Orchard','Art studio','Harbor','Night festival','Space museum'];
let sceneCursor=0;try{const saved=Number(localStorage.getItem('shape-garden-scene'));if(Number.isInteger(saved)&&saved>=0)sceneCursor=saved%scenes.length;}catch{}
let currentScene=0,huntParts=[],huntFound=new Set(),huntMarkup='';
let doneHunt=new Set();
function nextScene(){currentScene=sceneCursor;sceneCursor=(sceneCursor+1)%scenes.length;try{localStorage.setItem('shape-garden-scene',String(sceneCursor));}catch{}return scenes[currentScene];}
function ink(d){return '<path d="'+d+'" fill="none" stroke="#303531" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';}
function part(n,label,tag,attrs){const id=huntParts.length;huntParts.push({id,n,label});return '<'+tag+' '+attrs+' data-hunt="'+n+'" data-part="'+id+'" data-found="false" role="button" tabindex="0" aria-label="'+label+'" aria-pressed="false" fill="white" stroke="#303531" stroke-width="2.5" stroke-linejoin="round"/>';}
function disk(x,y,r,label){return part('circle',label,'circle',`cx="${x}" cy="${y}" r="${r}"`);}
function box(x,y,w,t,label){return part(w===t?'square':'rectangle',label,'rect',`x="${x}" y="${y}" width="${w}" height="${t}"`);}
function polygon(n,pts,label){return part(n,label,'polygon','points="'+pts+'"');}
function regular(n,x,y,r,label){const sides={pentagon:5,hexagon:6,octagon:8}[n];return polygon(n,Array.from({length:sides},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/sides;return (x+Math.cos(a)*r)+','+(y+Math.sin(a)*r)}).join(' '),label);}
function roof(x,y,w,t,label='roof'){return polygon('triangle',`${x},${y+t} ${x+w/2},${y} ${x+w},${y+t}`,label);}
function pot(x,y,label='flower pot'){return ink(`M${x+35} ${y}v-45m0 20q-25-30-35-10m35 0q25-30 35-10`)+polygon('trapezoid',`${x},${y} ${x+70},${y} ${x+56},${y+50} ${x+14},${y+50}`,label);}
function house(x,y,w=170){const t=w*.85;return box(x,y,w,t,'house wall')+roof(x-20,y-105,w+40,105)+box(x+w*.15,y+25,40,40,'window')+box(x+w*.62,y+t-80,42,80,'door');}
function tree(x,y,fruit=true){let a=box(x-12,y+20,24,125,'tree trunk');a+='<path d="M'+(x-60)+' '+(y+48)+' C'+(x-110)+' '+(y-15)+' '+(x-70)+' '+(y-115)+' '+x+' '+(y-85)+' C'+(x+85)+' '+(y-115)+' '+(x+110)+' '+(y+25)+' '+(x+60)+' '+(y+48)+' Z" fill="white" stroke="#303531" stroke-width="2.5"/>';if(fruit)for(const [dx,dy]of [[-40,-25],[12,-57],[48,0],[-6,25]])a+=disk(x+dx,y+dy,19,'fruit on tree');return a;}
function pine(x,y){return box(x-10,y+80,20,65,'pine trunk')+roof(x-62,y-70,124,155,'pine branches');}
function car(x,y){return polygon('trapezoid',`${x+25},${y} ${x+110},${y} ${x+145},${y+48} ${x},${y+48}`,'car roof')+box(x-20,y+48,190,48,'car body')+disk(x+20,y+96,24,'car wheel')+disk(x+130,y+96,24,'car wheel');}
function boat(x,y){return ink(`M${x+60} ${y-130}v130`)+roof(x+67,y-125,100,108,'boat sail')+polygon('trapezoid',`${x},${y} ${x+180},${y} ${x+145},${y+52} ${x+35},${y+52}`,'boat hull');}
function rocket(x,y){return box(x,y,85,170,'rocket body')+roof(x-5,y-75,95,75,'rocket nose')+disk(x+42.5,y+55,24,'rocket window')+roof(x-50,y+100,50,70,'rocket fin')+roof(x+85,y+100,50,70,'rocket fin')+ink(`M${x+20} ${y+180}l10 45 12-32 12 32 12-45`);}
function castle(x,y){let a=box(x,y,225,145,'castle wall');for(const dx of [-38,185])a+=box(x+dx,y-65,75,210,'castle tower')+roof(x+dx-9,y-130,93,65,'tower roof')+box(x+dx+20,y-25,32,32,'tower window');return a+box(x+92,y+65,45,80,'castle door');}
function birdhouse(x,y){return ink(`M${x} ${y+45}v70`)+regular('pentagon',x,y,42,'birdhouse')+disk(x,y+5,14,'birdhouse opening');}
function cloud(x,y){return '<path d="M'+x+' '+y+'q-20-35 15-43q0-32 35-25q22-35 47 3q45-5 38 30q35 15 12 35Z" fill="white" stroke="#303531" stroke-width="2.5"/>';}
function sun(x,y){let a='';for(let i=0;i<10;i++){const t=i*Math.PI/5;const px=x+Math.cos(t)*68,py=y+Math.sin(t)*68;a+=ink(`M${px} ${py}l${Math.cos(t)*19} ${Math.sin(t)*19}`);}return a+disk(x,y,49,'sun');}
function picnic(x,y){return box(x,y,135,65,'picnic blanket')+box(x+20,y+16,28,28,'napkin')+disk(x+90,y+32,19,'picnic plate');}
function train(x,y){return box(x,y,170,100,'train carriage')+box(x+185,y+20,125,80,'train engine')+box(x+265,y-30,28,50,'chimney')+box(x+25,y+15,45,45,'train window')+box(x+95,y+15,45,45,'train window')+[25,125,220,285].map(dx=>disk(x+dx,y+110,22,'train wheel')).join('');}
function coloringScene(i){huntParts=[];let a=ink('M15 440Q170 415 290 440T570 438T885 440');if(![2,3,7,16,18,19].includes(i))a+=sun(135,100)+cloud(350,80)+cloud(660,110);
switch(i){
case 0:a+=house(365,295)+tree(155,275)+tree(735,290)+car(600,365);break;
case 1:a+=ink('M15 300Q90 270 165 300T315 300T465 300T615 300T765 300T900 300')+boat(160,325)+picnic(570,385)+roof(600,210,170,90,'beach umbrella')+box(680,300,12,70,'umbrella pole');break;
case 2:a+=disk(125,105,48,'moon')+rocket(650,235)+house(310,300)+ink('M60 350q70-40 130 0m330 100q80-35 150 0');break;
case 3:a+=ink('M55 445v-100m0 35l-30-25m30 5l35-30M815 445v-115m0 40l-30-30m30 50l35-30');for(const [x,y]of [[100,80],[750,125],[600,80]])a+=disk(x,y,18,'bubble');a+=regular('pentagon',335,230,65,'fish body')+roof(220,200,55,70,'fish tail')+disk(355,215,12,'fish eye')+box(560,330,145,90,'treasure chest')+polygon('trapezoid','550,330 715,330 690,285 575,285','chest lid');break;
case 4:a+=castle(340,290)+tree(125,280)+birdhouse(760,295);break;
case 5:a+=house(345,300)+pine(145,280)+pine(760,275)+disk(610,385,47,'snowman body')+disk(610,315,30,'snowman head');break;
case 6:a+=box(45,240,190,200,'city building')+box(650,210,170,230,'city building');for(const x of [75,145,675,745])a+=box(x,270,40,40,'building window');a+=car(365,335);break;
case 7:a+=box(80,60,150,140,'room window')+ink('M80 130h150m-75-70v140M25 450h850')+house(375,295,150)+disk(145,370,48,'toy ball')+train(540,320);break;

function hunt(){solved=false;target=order[round];const title=nextScene();huntFound=new Set();huntMarkup=coloringScene(currentScene);const count=huntParts.filter(p=>p.n===target).length;frame('Find and color the '+target+'s.',`Search the ${title.toLowerCase()}. Tap all ${count} ${target}s to color them in.`,`<div class="hunt-instruction"><span class="hunt-sample">${shape(target,'white')}</span><strong id="hunt-count">0 / ${count} colored</strong><span>${title}</span><button class="quiet" id="huntzoom" aria-pressed="false">Zoom in</button></div><div class="hunt-viewport"><svg class="scene coloring-page" viewBox="0 0 900 600" role="group" aria-label="${title} coloring picture. Find the ${target}s."><rect x="8" y="8" width="884" height="584" rx="22" fill="white" stroke="#303531" stroke-width="3"/>${huntMarkup}</svg></div>`,`Picture ${round+1} / 8`,nextButton());$('#next').disabled=true;}
function found(el){if(solved||el.dataset.found==='true')return;if(el.dataset.hunt!==target){message(`That’s a ${el.dataset.hunt}. Look for the ${target}s.`);return;}const id=Number(el.dataset.part);if(huntFound.has(id))return;huntFound.add(id);el.dataset.found='true';el.setAttribute('fill',pick(['#f4cc73','#9bcdb0','#a9c9e9','#e6afbf']));el.setAttribute('aria-pressed','true');const total=huntParts.filter(p=>p.n===target).length;$('#hunt-count').textContent=`${huntFound.size} / ${total} colored`;if(huntFound.size===total){solved=true;doneHunt.add(target);message(`You colored all ${total} ${target}s!`);$('#next').disabled=false;}else message(`You found one! ${total-huntFound.size} more to color.`);}
function colorRound(){solved=false;selected=null;shapeName=pick(names);unit=shuffle(Object.keys(colors));seed=[...unit];slots=Array(6).fill(null);bank=shuffle(Object.keys(colors).flatMap(c=>Array.from({length:4},()=>({c,n:shapeName}))));renderColors();}
function slotsHtml(){return slots.map((v,i)=>`<button class="slot ${v?'filled':''}" data-slot="${i}" aria-label="Position ${i+1}${v?', '+v.c+' '+v.n:', empty'}">${v?shape(v.n,colors[v.c]):'<span>+</span>'}</button>`).join('');}
function pieceHtml(v,i){return `<button class="piece ${v.used?'used':''} ${selected===i?'chosen':''}" data-piece="${i}" ${v.used?'disabled':''} aria-label="${v.c} ${v.n}" aria-pressed="${selected===i}">${shape(v.n,colors[v.c])}<small>${cap(v.c)}</small></button>`;}
function renderColors(note=''){frame('Keep the colors going.','Drag a piece into a space, or tap a piece and then a space.',`<div class="sequence" aria-label="Color pattern">${seed.map(c=>`<div class="tile">${shape(shapeName,colors[c])}<small>${cap(c)}</small></div>`).join('')}${slotsHtml()}</div><p class="label">Your pieces · 4 blue, 4 red, 4 yellow ${shapeName==='octagon'?'octagons':shapeName+'s'}</p><div class="bank">${bank.map(pieceHtml).join('')}</div>`,`${bank.filter(v=>!v.used).length} pieces left`,`<button class="quiet" id="newcolor">New pattern</button> <button class="primary" id="checkcolor">Check pattern</button>`);if(note)message(note);}
let studioColor='blue',studioShape='circle';
function studio(){slots=Array(12).fill(null);selected=null;renderStudio();}
function renderStudio(note=''){bank=names.map(n=>({n,c:studioColor}));frame('Make your own pattern.','Drag shapes onto the spaces. Try repeating a little group!',`<div class="controls"><label for="paint">Piece color</label><select id="paint">${Object.keys(colors).map(c=>`<option value="${c}" ${studioColor===c?'selected':''}>${cap(c)}</option>`).join('')}</select><span class="small">Tap a filled space to remove its piece.</span></div><div class="sequence" aria-label="Your pattern">${slotsHtml()}</div><p class="label">Pick a shape · as many as you like</p><div class="bank">${bank.map(pieceHtml).join('')}</div>`,`Made by you`,`<button class="quiet" id="clear">Clear</button> <button class="primary" id="play">Play my pattern ♪</button>`);if(note)message(note);}
function place(index,pieceIndex){if(solved&&mode===4)return;const v=bank[pieceIndex];if(!v||v.used)return;if(mode===4){if(slots[index])bank[slots[index].bankId].used=false;slots[index]={...v,bankId:pieceIndex};v.used=true;}else slots[index]={n:v.n,c:v.c};selected=null;if(mode===4)renderColors('Piece placed!');else renderStudio('Your pattern is growing.');}
function checkColor(){if(slots.some(v=>!v)){message('Fill every space, then check your pattern.');return;}const wrong=slots.findIndex((v,i)=>v.c!==unit[(i+seed.length)%unit.length]);if(wrong>=0){message(`Look at space ${wrong+1}. Say the colors from the beginning and try again.`);return;}done.add(4);solved=true;tabs();message('Wonderful! You repeated the color pattern.');$('.bottom>div:last-child').innerHTML='<button class="quiet" id="newcolor">Play again</button> <button class="primary" id="continue">Make my own →</button>';}
function speak(t){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.82;speechSynthesis.speak(u);}else message('Read aloud is not available in this browser.');}
function playPattern(){clearInterval(timer);const filled=slots.map((v,i)=>v?i:-1).filter(i=>i>=0);if(!filled.length){message('Add some shapes to hear your pattern!');return;}done.add(5);tabs();let j=0;$('#play').disabled=true;function tick(){document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));if(j>=filled.length){clearInterval(timer);timer=null;$('#play').disabled=false;message('A pattern made by you! Keep creating.');return;}const i=filled[j++];$(`[data-slot="${i}"]`).classList.add('playing');speak(slots[i].c+' '+slots[i].n);}tick();timer=setInterval(tick,1100);}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-hunt]');if(!el)return;if(suppressClick){suppressClick=false;return;}if(el.dataset.mode!==undefined){doneHunt=new Set();start(+el.dataset.mode);return;}if(el.id==='read'){speak(($('#prompt')?.textContent||'Well done')+'. '+($('#instruction')?.textContent||''));return;}if(el.id==='huntzoom'){const page=$('.coloring-page');const zoomed=page.classList.toggle('zoomed');el.setAttribute('aria-pressed',String(zoomed));el.textContent=zoomed?'Zoom out':'Zoom in';}if(el.id==='hint'){ $('#sidehint').innerHTML=shape(order[round],'#8d79b7');el.hidden=true;}if(el.dataset.answer)answer(el.dataset.answer,el);if(el.dataset.hunt)found(el);if(el.id==='next'){round++;if(round===8)complete();else if(mode===0)quiz();else if(mode===1)sides();else if(mode===2)hunt();else pattern();}if(el.id==='again'){doneHunt=new Set();start(mode);}if(el.id==='continue')start(mode+1);if(el.id==='newcolor')colorRound();if(el.id==='checkcolor')checkColor();if(el.id==='clear'){clearInterval(timer);timer=null;studio();}if(el.id==='play')playPattern();if(el.dataset.piece!==undefined){selected=+el.dataset.piece;document.querySelectorAll('[data-piece]').forEach(x=>{x.classList.toggle('chosen',+x.dataset.piece===selected);x.setAttribute('aria-pressed',String(+x.dataset.piece===selected));});message('Now choose a space for your piece.');}if(el.dataset.slot!==undefined){const i=+el.dataset.slot;if(selected!==null)place(i,selected);else if(slots[i]&&!(solved&&mode===4)){if(mode===4)bank[slots[i].bankId].used=false;slots[i]=null;mode===4?renderColors():renderStudio();}}});
document.addEventListener('keydown',e=>{const el=e.target.closest('[data-hunt]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();found(el);}});
document.addEventListener('change',e=>{if(e.target.id==='paint'){studioColor=e.target.value;selected=null;renderStudio();}});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-piece]');if(!el||el.disabled||e.button!==0)return;drag={id:e.pointerId,index:+el.dataset.piece,x:e.clientX,y:e.clientY,el,ghost:null};el.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){const ghost=document.createElement('div');ghost.className='dragghost';ghost.innerHTML=shape(bank[drag.index].n,colors[bank[drag.index].c]);document.body.append(ghost);drag.ghost=ghost;}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]')?.classList.add('over');}});
document.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;if(d.ghost){const slot=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');d.ghost.remove();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));suppressClick=true;if(slot)place(+slot.dataset.slot,d.index);setTimeout(()=>suppressClick=false,100);}});
document.addEventListener('pointercancel',()=>{drag?.ghost?.remove();drag=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));});
start(0);
</script>
